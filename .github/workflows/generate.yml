name: Generate draft GTFS
on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - requirements.txt
      - '.github/workflows/generate.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
      - name: Generate research draft
        run: python generate.py --start "$(date -u +%F)" --end "$(date -u -d '+94 days' +%F)" --allow-estimates
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download canonical validator
        run: |
          curl --fail --silent --show-error --location https://api.github.com/repos/MobilityData/gtfs-validator/releases/latest -o validator-release.json
          python - <<'PY'
          import json, urllib.request
          release=json.load(open('validator-release.json'))
          assets=[a for a in release['assets'] if a['name'].endswith('.jar') and 'cli' in a['name'].lower()]
          if not assets:
              assets=[a for a in release['assets'] if a['name'].startswith('gtfs-validator') and a['name'].endswith('.jar') and not any(x in a['name'] for x in ('sources','javadoc','gui'))]
          assert len(assets)==1, [a['name'] for a in assets]
          urllib.request.urlretrieve(assets[0]['browser_download_url'],'validator.jar')
          PY
      - name: Validate draft
        run: java -jar validator.jar -i gtfs-armenia-draft.zip -o validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armenia-research-draft
          path: |
            gtfs-armenia-draft.zip
            gtfs-armenia-draft.report.json
            validation/
          if-no-files-found: warn
